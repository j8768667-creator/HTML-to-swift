<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML to Swift Playgrounds Converter</title>
    <meta name="description" content="Convert HTML and CSS markup into modern SwiftUI code ready for Apple Swift Playgrounds with live preview, customizable targets, and instant export." />
    <meta property="og:title" content="HTML to Swift Playgrounds Converter" />
    <meta property="og:description" content="Convert HTML and CSS markup into modern SwiftUI code ready for Apple Swift Playgrounds with live preview, customizable targets, and instant export." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #FAFAFA; color: #1A1A1A;">
        <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 12px;">
          <div style="width: 24px; height: 24px; border-radius: 6px; background-color: #F05138; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 14px;">S</div>
          <span style="font-size: 15px; font-weight: 600; letter-spacing: -0.01em;">HTML to Swift Playgrounds</span>
        </div>
        <p style="font-size: 12px; color: #6B7280; margin: 0 0 16px 0;">Loading converter workspace...</p>
        <div style="width: 140px; height: 3px; background-color: #E5E7EB; border-radius: 9999px; overflow: hidden; position: relative;">
          <div style="width: 50%; height: 100%; background-color: #F05138; border-radius: 9999px; animation: progress 1.2s infinite ease-in-out;"></div>
        </div>
        <style>
          @keyframes progress {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(200%); }
          }
        </style>
      </div>
    </div>
    <noscript>
      <div style="padding: 20px; text-align: center; font-family: sans-serif; color: #B91C1C; background: #FEF2F2;">
        JavaScript is required to run the HTML to Swift Playgrounds Converter. Please enable JavaScript in your browser.
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
